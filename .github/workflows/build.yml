name: 빌드 및 배포

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIP_NAME: family-boardgame.zip
  # 기본 브랜치에 push했을 때만 Releases·Pages에 올린다.
  IS_DEFAULT_BRANCH: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build:
    name: 테스트 및 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 테스트
        run: npm test

      - name: 빌드
        run: npm run build

      - name: 배포용 zip 만들기
        run: |
          mkdir -p package/family-boardgame
          cp dist/index.html release/README.txt package/family-boardgame/
          (cd package && zip -r "../$ZIP_NAME" family-boardgame)
          unzip -l "$ZIP_NAME"

      - name: 빌드 결과 보관 (Actions 아티팩트)
        uses: actions/upload-artifact@v7
        with:
          name: family-boardgame
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Pages용 아티팩트 업로드
        if: env.IS_DEFAULT_BRANCH == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  release:
    name: Releases에 업로드
    needs: build
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: family-boardgame

      - name: 릴리스 설명 작성
        run: |
          cat > notes.md <<NOTES
          ## 🎲 다운로드해서 하기
          1. 아래 **Assets**에서 \`${ZIP_NAME}\`을 받으세요.
          2. 압축을 풀고 \`family-boardgame/index.html\`을 더블클릭하면 브라우저에서 바로 실행돼요. (인터넷 필요 없음)

          ## 🌐 설치 없이 바로 하기
          https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

          ---
          커밋: ${GITHUB_SHA::7} · 빌드: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') (KST)
          NOTES

      - name: 최신 빌드 릴리스 갱신 (기본 브랜치)
        if: github.ref_type == 'branch'
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$ZIP_NAME" \
            --title "최신 빌드" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest

      - name: 버전 릴리스 만들기 (v* 태그)
        if: github.ref_type == 'tag'
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --latest=false

  pages:
    name: GitHub Pages 배포
    needs: build
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v5
